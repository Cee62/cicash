[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cicash"
version = "0.4.2"
description = "CIcash - a budget you lend to an AI agent, not money you give it: bounded, revocable, auditable spending authority."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["ai", "agent", "payments", "budget", "capability", "macaroon",
            "mcp", "authorization", "http-402", "delegation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
  "Topic :: Security :: Cryptography",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
ed25519 = ["cryptography>=42"]

[project.scripts]
cicash = "cicash.cli:main"
cicash-mcp = "cicash.mcp_server:main"

[project.urls]
Homepage = "https://github.com/Cee62/cicash"
Specification = "https://github.com/Cee62/cicash/blob/main/spec/SPEC.md"
Changelog = "https://github.com/Cee62/cicash/blob/main/CHANGELOG.md"
Issues = "https://github.com/Cee62/cicash/issues"

[tool.hatch.build.targets.sdist]
include = ["cicash", "tests", "spec", "tools", "examples", "README.md",
           "LICENSE", "NOTICE", "CHANGELOG.md", "demo.py"]

[tool.hatch.build.targets.wheel]
packages = ["cicash"]
